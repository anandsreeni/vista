<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VISTA</title>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; min-height: 100vh; }
  button { font-size: 1.6rem; padding: 1.2rem 2rem; margin: 0.6rem; border-radius: 12px; border: none; }
  /* Whole screen is one big button - a blind user can tap anywhere */
  #startArea { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
               font-size: 2.2rem; padding: 2rem; background: #000; }
  #mapBtn { position: fixed; top: 8px; right: 8px; z-index: 10; font-size: 0.9rem; padding: 0.5rem 0.8rem;
            background: #333; color: #aaa; margin: 0; }
  #status { font-size: 1.2rem; padding: 0.8rem; }
  #hint { font-size: 1.4rem; padding: 0.5rem; color: #ffd54f; }
  video { width: 100%; }
  #mapPanel { display: none; padding: 0.5rem; }
  #wpName { font-size: 1.4rem; padding: 0.6rem; width: 80%; }
  #captureBtn { background: #2e7d32; color: #fff; width: 85%; font-size: 2rem; }
  #recordBtn { background: #c62828; color: #fff; width: 85%; font-size: 2rem; }
  #undoBtn { background: #555; color: #fff; }
</style>
</head>
<body>
<div id="startArea">Tap anywhere to start VISTA</div>
<button id="mapBtn">map mode</button>

<div id="mapPanel">
  <div id="mapInfo" style="font-size:1.3rem; color:#80d8ff; padding:0.4rem">Walk so far: 0 steps</div>
  <input id="wpName" placeholder="spot name ONLY, e.g. f1_room_204"><br>
  <button id="markBtn" style="background:#1565c0; color:#fff; width:85%; font-size:2rem">MARK SPOT</button><br>
  <button id="recordBtn">RECORD 4 s</button><br>
  <button id="captureBtn">CAPTURE</button><br>
  <button id="undoBtn">Undo last</button>
  <button id="newWalkBtn" style="background:#444; color:#fff">Start new walk</button>
</div>

<div id="hint"></div>
<div id="typedPanel" style="display:none; padding:0.4rem">
  <input id="typedDest" placeholder="office  /  I'm at the entrance  /  where am I" style="font-size:1.1rem; padding:0.4rem; width:55%">
  <button id="typedGo" style="font-size:1.1rem; padding:0.4rem 1rem; margin:0">Go</button>
</div>
<div id="status">Not started</div>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" width="640" height="480" hidden></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const statusEl = document.getElementById("status");
const hintEl = document.getElementById("hint");

let lastSpokenId = null;   // id of the last sentence we spoke
let lastReply = Date.now();
let warned = false;        // already said "connection lost"?
let busy = false;          // a frame is still uploading
let navigating = false;
let listening = false;     // microphone is on - don't talk over the user
let destinations = [];     // [{id: "f0_staffroom", name: "the staffroom"}, ...]

function say(text, onDone) {
  speechSynthesis.cancel();                 // newest message wins
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-IN";
  if (onDone) {
    u.onend = onDone;
  }
  speechSynthesis.speak(u);
}

async function openCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment", width: 640, height: 480 },   // back camera
    audio: false
  });
  video.srcObject = stream;
  try {
    await navigator.wakeLock.request("screen");   // keep screen on
  } catch (e) {
    statusEl.textContent = "Wake lock failed - set screen timeout manually";
  }
}

// Same 640x480 JPEG for both modes, so map photos look exactly like live frames
function grabFrame(callback) {
  canvas.getContext("2d").drawImage(video, 0, 0, 640, 480);
  canvas.toBlob(callback, "image/jpeg", 0.7);
}

// ---------------- Destinations by voice ----------------
async function loadDestinations() {
  try {
    const res = await fetch("/destinations");
    destinations = (await res.json()).destinations;
  } catch (e) {
    destinations = [];
  }
}

// Words that don't help pick a place ("take me to the room 104 please" -> "104")
const STOP_WORDS = new Set(["the", "a", "an", "to", "go", "take", "me", "i", "want", "please",
  "room", "where", "is", "of", "on", "floor", "near", "s"]);

// Other ways people say the same thing
const SAME_AS = { "mens": "men", "gents": "men", "boys": "men", "womens": "women", "ladies": "women",
  "girls": "women", "toilet": "washroom", "bathroom": "washroom", "restroom": "washroom",
  "loo": "washroom", "exit": "entrance", "door": "entrance" };

function cleanWords(text) {
  return text.toLowerCase().replace(/'/g, "").replace(/[^a-z0-9 ]/g, " ").split(/\s+/)
    .map(w => SAME_AS[w] || w).filter(w => w && !STOP_WORDS.has(w));
}

function matchDestination(heard) {
  let best = null;
  let bestScore = 0;
  for (const place of destinations) {
    const placeText = (place.name + " " + place.id.replace(/_/g, " ")).toLowerCase();
    const placeWords = placeText.replace(/[^a-z0-9 ]/g, " ").split(/\s+/);
    const joined = placeText.replace(/[^a-z0-9]/g, "");     // "staffroom" also matches "staff room"
    let score = 0;
    for (const w of cleanWords(heard)) {
      if (placeWords.includes(w)) {
        score += /\d/.test(w) ? 5 : 2;      // room numbers count most
      } else if (w.length > 3 && joined.includes(w)) {
        score += 1;
      }
    }
    if (score > bestScore) {
      bestScore = score;
      best = place;
    }
  }
  return best;
}

async function setDestination(id) {
  try {
    await fetch("/destination?to=" + encodeURIComponent(id), { method: "POST" });
  } catch (e) {
    say("Could not set the destination. Check the connection.");
  }
}

function askDestination() {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) {
    say("Voice input is not available on this phone.");
    return;
  }
  if (listening) {
    return;
  }
  listening = true;
  hintEl.textContent = "Asking...";

  // Start the microphone when the question finishes - or after 2.5 s anyway,
  // because some phones never report that speech finished
  let started = false;
  const startMic = () => {
    if (started) {
      return;
    }
    started = true;
    const rec = new Recognition();
    rec.lang = "en-IN";
    rec.maxAlternatives = 3;
    rec.onstart = () => {
      hintEl.textContent = "Speak now...";
      navigator.vibrate(150);                      // buzz = microphone is on
    };
    rec.onresult = (event) => {
      // try each guess of what was said, use the first one that makes sense
      let handled = false;
      let heard = "";
      for (const alt of event.results[0]) {
        heard = alt.transcript;
        if (handleHeard(heard, false)) {
          handled = true;
          break;
        }
      }
      if (!handled) {
        handleHeard(heard, true);                    // speaks "Sorry, I didn't find that..."
      }
    };
    rec.onerror = (event) => {
      // Show the real reason on screen so the team can fix it
      hintEl.textContent = "Voice error: " + event.error;
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        say("Microphone permission is off.");
      } else if (event.error === "network") {
        say("Voice needs internet on the phone.");
      } else {
        say("Sorry, I didn't hear you. Tap the screen to try again.");
      }
    };
    rec.onend = () => {
      listening = false;
      if (hintEl.textContent === "Speak now...") {
        hintEl.textContent = "Heard nothing - tap to try again";
      }
    };
    try {
      rec.start();
    } catch (e) {
      listening = false;
      hintEl.textContent = "Voice error: " + e.message;
    }
  };

  say("Where do you want to go?", startMic);
  setTimeout(startMic, 2500);
}

// What the user said -> "I'm at X" and/or "take me to Y".
// Returns true if it understood. sorryIfNot = speak the help message when it didn't.
const HERE_PATTERN = /\b(i am|i'm|im|i m|standing)\s+(at|near|in|by|outside)\b/;
const TO_PATTERN = /\b(take me to|go to|going to|want to go to|to go to|need to go to)\b/;

const WHERE_PATTERN = /\b(where am i|where i am|where are we|current location|my location|which place|where is this)\b/;

function handleHeard(text, sorryIfNot) {
  const t = text.toLowerCase();
  if (WHERE_PATTERN.test(t)) {                        // "Where am I?"
    hintEl.textContent = "Asking: where am I?";
    fetch("/ask?q=where", { method: "POST" }).catch(() => say("Could not reach VISTA. Check the connection."));
    return true;
  }
  const here = t.match(HERE_PATTERN);
  let destText = t;
  if (here) {
    const rest = t.slice(here.index + here[0].length);  // "the entrance take me to the office"
    let hereText = rest;
    destText = "";
    const to = rest.match(TO_PATTERN);
    if (to) {
      hereText = rest.slice(0, to.index);
      destText = rest.slice(to.index + to[0].length);
    }
    const herePlace = matchDestination(hereText);
    if (!herePlace) {
      if (sorryIfNot) {
        hintEl.textContent = "Didn't catch: " + text;
        say("Sorry, I don't know that place. Tap the screen to try again.");
      }
      return false;
    }
    if (destText) {
      const destPlace = matchDestination(destText);
      if (destPlace) {
        setDestination(destPlace.id);
      }
    }
    hintEl.textContent = "You are at " + herePlace.name;
    setTimeout(() => setHere(herePlace.id), 400);  // after the destination, so directions use it
    return true;
  }
  const place = matchDestination(destText);
  if (place) {
    hintEl.textContent = "Going to " + place.name;
    setDestination(place.id);                      // voice_guide.py says "Going to ..."
    return true;
  }
  if (sorryIfNot) {
    hintEl.textContent = "Didn't catch: " + text;
    say("Sorry, I didn't find that. You can say " +
        destinations.map(d => d.name).join(", ") + ". Tap the screen to try again.");
  }
  return false;
}

async function setHere(id) {
  try {
    await fetch("/here?at=" + encodeURIComponent(id), { method: "POST" });
  } catch (e) {
    say("Could not send your location. Check the connection.");
  }
}

// Typed box - backup for the team while testing (same sentences as voice)
function typedDestination(event) {
  event.stopPropagation();
  handleHeard(document.getElementById("typedDest").value, true);
}

// ---------------- Step counter + turn sensor ----------------
// Steps: the chest bounces up and down once per step -> peaks in total acceleration.
// Turns: gyroscope rotation around the "up" direction (found from gravity), added up over time.
//        + = turned LEFT, - = turned RIGHT. If the phone shows the wrong side, open the page
//        with ?flip=1 at the end of the address.
// Steps are found as bounces ABOVE the phone's own average, so it works for any phone / belt.
// Change with ?sens=0.4 (more sensitive) or ?sens=1.0 (less) at the end of the address.
const STEP_DELTA = parseFloat(new URLSearchParams(location.search).get("sens") || "0.6");  // m/s2 above average
const STEP_RESET = STEP_DELTA * 0.3;                                                         // drop back below this
const MIN_STEP_MS = 300;     // nobody takes more than ~3 steps per second
const TURN_SIGN = new URLSearchParams(location.search).get("flip") === "1" ? -1 : 1;

let steps = 0;
let yaw = 0;                 // degrees turned since start
let smoothMag = null;
let baseline = null;         // slow average of the movement = "standing" level
let aboveHigh = false;
let bounce = 0;              // biggest bounce in the last second (shown on screen)
let bounceTime = 0;
let lastStepTime = 0;
let gravity = { x: 0, y: 9.8, z: 0 };
let lastMotionTime = null;
let motionWorking = false;

function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x === null) {
    return;
  }
  motionWorking = true;
  const now = performance.now();

  // --- steps ---
  const mag = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
  if (smoothMag === null) {
    smoothMag = mag;
    baseline = mag;
  }
  smoothMag = 0.6 * smoothMag + 0.4 * mag;            // remove jitter
  baseline = 0.98 * baseline + 0.02 * mag;            // slow average
  const delta = smoothMag - baseline;
  if (delta > bounce || Date.now() - bounceTime > 1000) {
    bounce = Math.max(delta, 0);
    bounceTime = Date.now();
  }
  if (!aboveHigh && delta > STEP_DELTA && Date.now() - lastStepTime > MIN_STEP_MS) {
    steps += 1;
    lastStepTime = Date.now();
    aboveHigh = true;
  }
  if (aboveHigh && delta < STEP_RESET) {
    aboveHigh = false;
  }

  // --- turns ---
  gravity.x = 0.9 * gravity.x + 0.1 * a.x;            // slow average = which way is "up"
  gravity.y = 0.9 * gravity.y + 0.1 * a.y;
  gravity.z = 0.9 * gravity.z + 0.1 * a.z;
  const r = e.rotationRate;
  if (!orientationWorking && r && r.alpha !== null && lastMotionTime !== null) {   // gyro only as a backup
    const g = Math.sqrt(gravity.x * gravity.x + gravity.y * gravity.y + gravity.z * gravity.z);
    // rotationRate: beta = around x, gamma = around y, alpha = around z (degrees per second)
    const upRate = (r.beta * gravity.x + r.gamma * gravity.y + r.alpha * gravity.z) / g;
    const dt = Math.min((now - lastMotionTime) / 1000, 0.2);
    yaw += TURN_SIGN * upRate * dt;
  }
  lastMotionTime = now;
}

// ---- Turns from the phone's orientation sensor (Android already corrects and combines its sensors) ----
// Works out which way the CAMERA points (like a compass), however the phone is mounted.
let lastHeading = null;
let orientationWorking = false;

function headingFrom(alpha, beta, gamma) {
  const d = Math.PI / 180;
  const cA = Math.cos(alpha * d);
  const sA = Math.sin(alpha * d);
  const cB = Math.cos(beta * d);
  const sB = Math.sin(beta * d);
  const cG = Math.cos(gamma * d);
  const sG = Math.sin(gamma * d);
  const east = -(cG * sA * sB + cA * sG);        // the camera looks along the phone's -z axis
  const north = -(sA * sG - cA * cG * sB);
  if (Math.abs(east) + Math.abs(north) < 0.2) {
    return null;                                 // camera pointing straight up or down
  }
  return Math.atan2(east, north) / d;
}

function onOrientation(e) {
  if (e.alpha === null || e.beta === null || e.gamma === null) {
    return;
  }
  const h = headingFrom(e.alpha, e.beta, e.gamma);
  if (h === null) {
    return;
  }
  orientationWorking = true;
  if (lastHeading !== null) {
    let dh = h - lastHeading;
    if (dh > 180) {
      dh -= 360;
    }
    if (dh < -180) {
      dh += 360;
    }
    yaw += TURN_SIGN * (-dh);                    // turning LEFT makes the heading go down
  }
  lastHeading = h;
}

async function startMotion() {
  // iPhones need permission; Android doesn't
  if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
    try {
      await DeviceMotionEvent.requestPermission();
    } catch (e) {
      // ignore - camera-only navigation still works
    }
  }
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    try {
      await DeviceOrientationEvent.requestPermission();
    } catch (e) {
      // not an iPhone
    }
  }
  window.addEventListener("deviceorientation", onOrientation);
  window.addEventListener("devicemotion", onMotion);
}

function motionText() {
  if (!motionWorking) {
    return "motion sensor: OFF";
  }
  const side = yaw > 20 ? " (left)" : (yaw < -20 ? " (right)" : "");
  return "steps " + steps + " | turned " + Math.round(yaw) + "°" + side + " | bounce " + bounce.toFixed(1);
}

// ---------------- Navigation mode ----------------
async function startVista() {
  await startMotion();
  document.getElementById("startArea").style.display = "none";
  document.getElementById("mapBtn").style.display = "none";
  await openCamera();
  navigating = true;
  document.getElementById("typedPanel").style.display = "block";
  await setDestination("");                         // start with no destination
  setInterval(sendFrame, 200);                      // 5 frames per second
  setInterval(checkConnection, 500);
  askDestination();                                 // "Where do you want to go?"
}

// While navigating, a tap ANYWHERE asks for a new destination
document.body.addEventListener("click", () => {
  if (navigating) {
    askDestination();
  }
});

function sendFrame() {
  if (busy) {
    return;                           // skip: never queue frames
  }
  busy = true;
  grabFrame(async (blob) => {
    try {
      const headers = {};
      if (motionWorking) {
        headers["X-Steps"] = String(steps);           // step count + turn travel with each frame
        headers["X-Yaw"] = yaw.toFixed(1);
      }
      const res = await fetch("/frame", {
        method: "POST",
        body: blob,
        headers: headers,
        signal: AbortSignal.timeout(2000)   // give up after 2 s
      });
      const speech = await res.json();
      lastReply = Date.now();
      statusEl.textContent = "Connected | " + motionText();
      if (warned) {
        warned = false;
        say("Connection back");
      }
      if (lastSpokenId === null) {
        lastSpokenId = speech.id;     // first reply: don't repeat an old message
      } else if (speech.id !== lastSpokenId && speech.text && !listening) {
        lastSpokenId = speech.id;     // (while listening, wait - it is spoken right after)
        hintEl.textContent = speech.text;
        say(speech.text);
      }
    } catch (e) {
      statusEl.textContent = "No connection";
    }
    busy = false;
  });
}

function checkConnection() {
  if (!warned && Date.now() - lastReply > 2000) {
    warned = true;
    say("Connection lost, please stop");
  }
}

// ---------------- Mapping mode (for the team, not the user) ----------------
async function startMapping(event) {
  event.stopPropagation();
  document.getElementById("startArea").style.display = "none";
  document.getElementById("mapBtn").style.display = "none";
  await openCamera();
  await startMotion();                              // count steps + turns between spots
  document.getElementById("mapPanel").style.display = "block";
  statusEl.textContent = "Mapping: at each spot type its name, then MARK SPOT";
  setInterval(showMapInfo, 300);
}

// ---------------- Steps + turns between spots while mapping ----------------
let mapBaseSteps = 0;
let mapBaseYaw = 0;
let prevSpot = null;          // last spot recorded on this walk

function turnWord(deg) {
  if (deg > 50) {
    return "turned LEFT (" + Math.round(deg) + "°)";
  }
  if (deg < -50) {
    return "turned RIGHT (" + Math.round(-deg) + "°)";
  }
  return "straight";
}

function showMapInfo() {
  const walked = steps - mapBaseSteps;
  const from = prevSpot ? "From " + prevSpot + ": " : "Walk so far: ";
  const sensor = motionWorking ? "" : "  (motion sensor OFF!)";
  document.getElementById("mapInfo").textContent =
    from + walked + " steps, " + turnWord(yaw - mapBaseYaw) + sensor;
}

function cleanName(text) {
  return text.trim().toLowerCase().replace(/ /g, "_").replace(/[^a-z0-9_]/g, "");
}

// Called when RECORD starts at a spot: save the walk from the previous spot to this one
function markSpot(name) {
  const walked = steps - mapBaseSteps;
  const turned = yaw - mapBaseYaw;
  if (prevSpot && name !== prevSpot && walked >= 2) {
    fetch("/leg?from=" + encodeURIComponent(prevSpot) + "&to=" + encodeURIComponent(name) +
          "&steps=" + walked + "&yaw=" + turned.toFixed(0), { method: "POST" })
      .then(r => r.json())
      .then(r => { statusEl.textContent = "Saved walk: " + prevSpot + " -> " + name + ", " + walked + " steps, " + turnWord(turned); })
      .catch(() => { statusEl.textContent = "Could not save the walk - check connection"; });
  }
  if (name !== prevSpot) {
    mapBaseSteps = steps;                            // start counting the next walk from here
    mapBaseYaw = yaw;
    prevSpot = name;
  }
}

// MARK SPOT: save the steps + turn from the previous spot, no photos
function markOnly(event) {
  event.stopPropagation();
  const name = cleanName(document.getElementById("wpName").value);
  if (!name) {
    statusEl.textContent = "Type the spot name first";
    return;
  }
  if (name === prevSpot) {
    statusEl.textContent = name + " is already marked - type the NEXT spot's name";
    return;
  }
  if (!prevSpot) {
    statusEl.textContent = "Start of walk: " + name + ". Now walk to the next spot.";
  }
  markSpot(name);
  navigator.vibrate([200, 100, 200]);
  document.getElementById("wpName").value = "";
}

function newWalk(event) {
  event.stopPropagation();
  prevSpot = null;
  mapBaseSteps = steps;
  mapBaseYaw = yaw;
  statusEl.textContent = "New walk: RECORD the first spot";
}

function capture() {
  const name = document.getElementById("wpName").value;
  grabFrame(async (blob) => {
    try {
      const res = await fetch("/capture?name=" + encodeURIComponent(name), {
        method: "POST",
        body: blob,
        signal: AbortSignal.timeout(3000)
      });
      const r = await res.json();
      if (r.ok) {
        statusEl.textContent = r.name + ": " + r.count + " photos";
        navigator.vibrate(100);       // feel it worked without looking
      } else {
        statusEl.textContent = r.error;
      }
    } catch (e) {
      statusEl.textContent = "Capture failed - check connection";
    }
  });
}

// Record: 1 frame every 0.5 s for 4 s = 8 photos, while walking slowly to the spot
let recording = false;

function record() {
  if (recording) {
    return;                           // already recording, ignore extra taps
  }
  const name = cleanName(document.getElementById("wpName").value);
  if (!name) {
    statusEl.textContent = "Type the spot name first";
    return;
  }
  markSpot(name);
  recording = true;
  document.getElementById("recordBtn").textContent = "RECORDING...";
  let shots = 0;
  const timer = setInterval(() => {
    capture();
    shots += 1;
    if (shots >= 8) {
      clearInterval(timer);
      recording = false;
      document.getElementById("recordBtn").textContent = "RECORD 4 s";
      navigator.vibrate([200, 100, 200]);   // double buzz = done
    }
  }, 500);
}

async function undo() {
  const name = document.getElementById("wpName").value;
  try {
    const res = await fetch("/undo?name=" + encodeURIComponent(name), { method: "POST" });
    const r = await res.json();
    statusEl.textContent = r.ok ? (r.name + ": " + r.count + " photos") : r.error;
  } catch (e) {
    statusEl.textContent = "Undo failed - check connection";
  }
}

document.getElementById("startArea").onclick = (event) => {
  event.stopPropagation();
  startVista();
};
document.getElementById("mapBtn").onclick = startMapping;
document.getElementById("captureBtn").onclick = capture;
document.getElementById("undoBtn").onclick = undo;
document.getElementById("recordBtn").onclick = record;
document.getElementById("newWalkBtn").onclick = newWalk;
document.getElementById("markBtn").onclick = markOnly;
document.getElementById("typedGo").onclick = typedDestination;
document.getElementById("typedDest").onclick = (event) => event.stopPropagation();
loadDestinations();
</script>
</body>
</html>
